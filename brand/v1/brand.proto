syntax = "proto3";

package brand.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "media/v1/media.proto";
import "validation/v1/rules.proto";

// A brand, owned by an individual or a company.
message Brand {
  // Unique identifier of the brand.
  string id = 1;
  // Name of the brand.
  string name = 2;
  // Short tagline shown with the brand.
  string tagline = 3;
  // Description of the brand.
  string description = 4;
  // Logo of the brand.
  media.v1.Image logo = 5;
  // Website of the brand, an http:// or https:// URL.
  string website = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.http_url) = true
  ];
  // Trademark class under the Nice classification, 1 to 45.
  int32 trademark_class = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 45
    }
  ];
  // Whether the brand is active.
  bool is_active = 10;
  // Owner of the brand: a user or a business entity, e.g. shop:User:u_1 or shop:BusinessEntity:b_1.
  // Set at creation.
  string owner_arn = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.entity_arn) = true,
    (buf.validate.field).cel = {
      id: "brand.owner_arn_type"
      message: "owner_arn must be a User or a BusinessEntity"
      expression: "this.matches('^[^:]+:(User|BusinessEntity):[^:]+$')"
    }
  ];
  // Time the brand was created. Output only.
  google.protobuf.Timestamp create_time = 12;
  // Time the brand was last updated. Output only.
  google.protobuf.Timestamp update_time = 13;

  // replaced by owner_arn
  reserved 7, 8;
  reserved "owner_id", "owner_type";
}
