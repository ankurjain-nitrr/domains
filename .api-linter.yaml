# Google API linter (https://linter.aip.dev) configuration.
# Rules are disabled only where they conflict with a deliberate repo decision, documented in
# docs/api-conventions.md and CLAUDE.md. For a one-off exception, disable inline on the element instead:
#   // (-- api-linter: core::0136::verb-noun=disabled
#   //     aip.dev/not-precedent: <reason> --)
- included_paths:
    - "**/*.proto"
  disabled_rules:
    # Resources are identified by `id` and referenced across domains by ARN (tenant:entity_type:entity_id),
    # not by AIP-122 resource names, and standard methods return <Method>Response wrappers.
    - core::0123::resource-annotation
    - core::0131::method-signature
    - core::0131::request-name-required
    - core::0131::request-unknown-fields
    - core::0131::response-message-name
    - core::0132::request-parent-required
    - core::0132::request-unknown-fields
    - core::0132::response-unknown-fields
    - core::0133::request-id-field
    - core::0133::response-message-name
    - core::0134::method-signature
    - core::0134::response-message-name
    - core::0135::method-signature
    - core::0135::request-name-required
    - core::0135::request-unknown-fields
    - core::0135::response-message-name
    - core::0231::request-names-field
    - core::0231::request-unknown-fields

    # Only multi-field updates take an update_mask (see "Update" in docs/api-conventions.md).
    - core::0134::request-mask-required

    # page_size is int64 across the repo (see "Pagination" in docs/api-conventions.md).
    - core::0158::request-page-size-field

    # Required and optional fields are declared and enforced with protovalidate, not google.api.field_behavior.
    - core::0203::field-behavior-required
    - core::0133::request-resource-behavior
    - core::0134::update-mask-optional-behavior
    - core::0216::state-field-output-only

    # gRPC only; no HTTP/JSON transcoding.
    - core::0127::http-annotation

    # Java options are set at generation time by buf managed mode (buf.gen.yaml).
    - core::0191::java-multiple-files
    - core::0191::java-outer-classname
    - core::0191::java-package

    # Shared types from commons, collections, media and validation are used across domains by design.
    - core::0215::foreign-type-reference

    # Services are declared after the messages they use.
    - core::0191::file-layout

# Predefined protovalidate rules are extensions, which require proto2.
- included_paths:
    - "validation/v1/rules.proto"
  disabled_rules:
    - core::0191::proto-version
