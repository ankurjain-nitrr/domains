syntax = "proto3";

package user_interactions.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "user_interactions/v1/filters.proto";
import "validation/v1/rules.proto";

// multi tenant like capabilities, arn format references # movies can be liked by users
//
// Likes and dislikes are mutually exclusive: a user can either like or dislike an entity, not both.
// Creating a like removes the user's existing dislike on the same entity in the same operation.
// Undoing a like does not restore a previously removed dislike.
message Like {
  // Unique identifier of the like.
  string id = 1;
  // References id from iam service.
  string user_id = 2;
  // Multi tenant id # tenant:entity_type:entity_id.
  string entity_arn = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.entity_arn) = true
  ];
  // Time the like was created. Output only.
  google.protobuf.Timestamp create_time = 4;
}

// removes the user's existing dislike on the same entity, if any
message LikeRequest {
  // The like to create.
  Like like = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "like.user_id"
      message: "user_id is required"
      expression: "this.user_id != ''"
    },
    (buf.validate.field).cel = {
      id: "like.entity_arn"
      message: "entity_arn is required"
      expression: "this.entity_arn != ''"
    }
  ];
}

// Response message for LikeService.Like.
message LikeResponse {
  // The created like.
  Like like = 1;
}

// Request message for LikeService.UndoLike.
message UndoLikeRequest {
  // Id of the user, references iam.
  string user_id = 1 [(buf.validate.field).required = true];
  // Multi tenant id # tenant:entity_type:entity_id.
  string entity_arn = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.entity_arn) = true
  ];
}

// returns the removed like
message UndoLikeResponse {
  // The removed like.
  Like like = 1;
}

// Request message for LikeService.HasLiked.
message HasLikedRequest {
  // Id of the user, references iam.
  string user_id = 1 [(buf.validate.field).required = true];
  // Multi tenant id # tenant:entity_type:entity_id.
  string entity_arn = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.entity_arn) = true
  ];
}

// Response message for LikeService.HasLiked.
message HasLikedResponse {
  // Whether the user has liked the entity.
  bool has_liked = 1;
}

// check multiple entities for one user in one call, e.g. for rendering a feed
message BatchHasLikedRequest {
  // Id of the user, references iam.
  string user_id = 1 [(buf.validate.field).required = true];
  // Multi tenant id # tenant:entity_type:entity_id.
  repeated string entity_arns = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {[validation.v1.entity_arn]: true}
    }
  }];
}

// Response message for LikeService.BatchHasLiked.
message BatchHasLikedResponse {
  // Entity_arn -> whether the user has liked it.
  map<string, bool> has_liked = 1;
}

// list all likes by user or likes on specific entity
message ListLikesRequest {
  // Which items to include. Exactly one filter is required.
  oneof filter {
    option (buf.validate.oneof).required = true;
    // Only items made by a user.
    FilterByUser user_filter = 1;
    // Only items on an entity.
    FilterByEntity entity_filter = 2;
  }
  // Maximum number of results to return. The server applies a default and a maximum.
  int64 page_size = 3 [(buf.validate.field).int64.gte = 0];
  // Page token from a previous response's next_page_token. Empty for the first page.
  string page_token = 4;
}

// Response message for LikeService.ListLikes.
message ListLikesResponse {
  // The likes on this page.
  repeated Like likes = 1;
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 2;
}

// count likes by user or likes on specific entity
message CountLikesRequest {
  // Which items to include. Exactly one filter is required.
  oneof filter {
    option (buf.validate.oneof).required = true;
    // Only items made by a user.
    FilterByUser user_filter = 1;
    // Only items on an entity.
    FilterByEntity entity_filter = 2;
  }
}

// Response message for LikeService.CountLikes.
message CountLikesResponse {
  // Number of matching items.
  int64 count = 1;
}

// count likes on multiple entities in one call, e.g. for rendering a feed
message BatchCountLikesRequest {
  // Multi tenant id # tenant:entity_type:entity_id.
  repeated string entity_arns = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {[validation.v1.entity_arn]: true}
    }
  }];
}

// Response message for LikeService.BatchCountLikes.
message BatchCountLikesResponse {
  // Entity_arn -> count.
  map<string, int64> counts = 1;
}

// Likes on any entity. Liking removes the user's dislike on the same entity.
service LikeService {
  // Likes an entity. Removes the user's existing dislike on the entity, if any.
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: Like is the domain verb; the entity is identified by entity_arn. --)
  rpc Like(LikeRequest) returns (LikeResponse) {}
  // Removes the user's like on an entity and returns it.
  rpc UndoLike(UndoLikeRequest) returns (UndoLikeResponse) {}
  // Checks whether a user has liked an entity.
  rpc HasLiked(HasLikedRequest) returns (HasLikedResponse) {}
  // Checks, for each of several entities, whether a user has liked it.
  rpc BatchHasLiked(BatchHasLikedRequest) returns (BatchHasLikedResponse) {}
  // Lists likes, a page at a time.
  rpc ListLikes(ListLikesRequest) returns (ListLikesResponse) {}
  // Counts likes matching a filter.
  rpc CountLikes(CountLikesRequest) returns (CountLikesResponse) {}
  // Counts likes on each of several entities in one call.
  rpc BatchCountLikes(BatchCountLikesRequest) returns (BatchCountLikesResponse) {}
}
