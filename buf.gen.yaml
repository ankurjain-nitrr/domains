version: v1
managed:
  enabled: true
  java_multiple_files: true
  java_package_prefix:
    default: "com.domains"
    # dependencies keep their own published packages
    except:
      - buf.build/googleapis/googleapis
      - buf.build/bufbuild/protovalidate
  go_package_prefix:
    default: "github.com/ankurjainnitrr/domains/gen/proto/go"
    # dependencies keep their own published packages
    except:
      - buf.build/googleapis/googleapis
      - buf.build/bufbuild/protovalidate
plugins:
  - name: go
    out: gen/proto/go
    opt: paths=source_relative
  - name: go-grpc
    out: gen/proto/go
    opt: paths=source_relative
  - name: java
    out: gen/proto/java
  - name: grpc-java
    out: gen/proto/java
