syntax = "proto3";

package bank.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "validation/v1/rules.proto";

// Type of a bank account.
enum AccountType {
  // Unspecified. Not a valid value.
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  // Savings account.
  ACCOUNT_TYPE_SAVINGS = 1;
  // Current account, for businesses.
  ACCOUNT_TYPE_CURRENT = 2;
}

// A bank account held in India, owned by a user or a business entity.
message BankAccount {
  // Lifecycle state of a bank account.
  enum State {
    // Unspecified. Not a valid value.
    STATE_UNSPECIFIED = 0;
    // The account can be used.
    STATE_ACTIVE = 1;
    // Blocked or closed or inactive for some reason.
    STATE_INACTIVE = 2;
  }

  // Unique identifier of the bank account.
  string id = 1;
  // Owner of the account: a user (with a valid KYC) or a business entity, e.g. shop:User:u_1.
  string owner_arn = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.entity_arn) = true,
    (buf.validate.field).string.(validation.v1.owner_arn) = true
  ];
  // Account number, 9 to 18 digits.
  string account_number = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = '^[0-9]{9,18}$'
  ];
  // Ifsc code of the bank branch.
  string ifsc_code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.ifsc) = true
  ];
  // Type of the account.
  AccountType account_type = 5 [(buf.validate.field).enum.defined_only = true];
  // Lifecycle state of the account. Set by MarkBankAccountAsActive and MarkBankAccountAsInactive.
  State state = 6 [(buf.validate.field).enum.defined_only = true];
  // Time the bank account was created. Output only.
  google.protobuf.Timestamp create_time = 7;
  // Time the bank account was last updated. Output only.
  google.protobuf.Timestamp update_time = 8;
}
