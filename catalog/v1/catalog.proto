syntax = "proto3";

package catalog.v1;

import "buf/validate/validate.proto";
import "collections/v1/collections.proto";
import "media/v1/media.proto";

// A catalog of products.
message Catalog {
  // Id of the catalog.
  string id = 1;
  // Name of the catalog.
  string name = 2;
  // Description of the catalog.
  string description = 3;
}

// nested message for category
message Category {
  // Id of the category.
  string id = 1;
  // Name of the category.
  string name = 2;
  // Description of the category.
  string description = 3;
  // Images of the category.
  repeated media.v1.Image images = 4;
  // Subcategories of the category.
  repeated Category subcategories = 5;
  // Attributes of the category.
  repeated Attribute attributes = 6;
}

// Type of the values an attribute holds.
enum AttributeType {
  // Unspecified. Not a valid value.
  ATTRIBUTE_TYPE_UNSPECIFIED = 0;
  // Validation based on length, regex, or specific values.
  ATTRIBUTE_TYPE_TEXT = 1;
  // Whole number; validation based on range or specific values.
  ATTRIBUTE_TYPE_NUMBER = 2;
  // True or false.
  ATTRIBUTE_TYPE_BOOLEAN = 3;
  // Decimal number.
  ATTRIBUTE_TYPE_DECIMAL = 4;
  // Group of sub-attributes, see AttributeConstraints.sub_attributes.
  ATTRIBUTE_TYPE_COMPLEX = 5;
  // Reference to an existing IdentifiedComplexValue.
  ATTRIBUTE_TYPE_REFERENCE = 6;
  // Image.
  ATTRIBUTE_TYPE_IMAGE = 7;
}

// Attribute is a key-value pair that can be used to filter the catalog
message Attribute {
  // Id of the attribute.
  string id = 1;
  // Name of the attribute.
  string name = 2;
  // Description of the attribute.
  string description = 3;
  // Icon of the attribute.
  media.v1.Image icon = 4;
  // Constraints for the attribute.
  AttributeConstraints attribute_constraints = 5 [(buf.validate.field).required = true];
  // Whether the attribute is unique.
  bool is_unique = 6;
  // Whether the attribute is visible to the user.
  bool is_visible = 7;
  // Whether the attribute is active.
  bool is_active = 8;
}

// AttributeConstraints defines the type of an attribute and the rules its values must satisfy.
//
// Rules use protovalidate's FieldRules, the same vocabulary used to annotate fields across this repo, stored as data
// because attributes are defined at runtime. They apply to the values list of the matching AttributeValue case:
//
//   rules.required                        attribute must be present (at least one value)
//   rules.ignore = IGNORE_IF_ZERO_VALUE   list rules below apply only when the attribute is present
//   rules.repeated.min_items / max_items  how many values; set max_items = 1 for a single-valued attribute
//   rules.repeated.unique                 reject duplicate values
//   rules.repeated.items                  rules for each value, typed by attribute_type:
//                                           TEXT, REFERENCE -> items.string  (min_len, max_len, pattern, in, ...)
//                                           NUMBER          -> items.int64   (gte, lte, in, ...)
//                                           DECIMAL         -> items.double  (gte, lte, finite, ...)
//                                           BOOLEAN         -> items.bool
//                                           IMAGE, COMPLEX  -> items.cel     (CEL over media.v1.Image / ComplexValue)
//
// Example, 1-5 tags of 2-20 lowercase letters, optional:
//   rules: {ignore: IGNORE_IF_ZERO_VALUE, repeated: {min_items: 1, max_items: 5, unique: true,
//           items: {string: {min_len: 2, max_len: 20, pattern: "^[a-z]+$"}}}}
//
// Services enforce the rules by building a message descriptor at runtime with a single `values` field carrying
// `rules` as its (buf.validate.field) option, and validating the AttributeValue's list with protovalidate
// (e.g. dynamicpb in Go). COMPLEX values are validated per sub-attribute, recursively.
message AttributeConstraints {
  option (buf.validate.message).cel = {
    id: "attribute_constraints.list_rules"
    message: "per-value rules go in rules.repeated.items"
    expression: "!has(this.rules.string) && !has(this.rules.int64) && !has(this.rules.double) && !has(this.rules.bool)"
  };
  option (buf.validate.message).cel = {
    id: "attribute_constraints.item_type"
    message: "rules.repeated.items type must match attribute_type"
    expression:
      "!has(this.rules.repeated.items.string) && !has(this.rules.repeated.items.int64) && !has(this.rules.repeated.items.double) && !has(this.rules.repeated.items.bool)"
      " || (this.attribute_type in [1, 6] && has(this.rules.repeated.items.string))"
      " || (this.attribute_type == 2 && has(this.rules.repeated.items.int64))"
      " || (this.attribute_type == 4 && has(this.rules.repeated.items.double))"
      " || (this.attribute_type == 3 && has(this.rules.repeated.items.bool))"
  };
  option (buf.validate.message).cel = {
    id: "attribute_constraints.sub_attributes"
    message: "sub_attributes are required for COMPLEX attributes and not allowed otherwise"
    expression: "(this.attribute_type == 5) == (size(this.sub_attributes) > 0)"
  };

  // Type of the attribute.
  AttributeType attribute_type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Rules for the attribute's values, see above.
  buf.validate.FieldRules rules = 2;
  // Attributes of a COMPLEX attribute.
  repeated Attribute sub_attributes = 3;
}

// AttributeValue holds the values of an attribute; a single-valued attribute holds a list of one
// the populated case must match the attribute's type, and the list must satisfy AttributeConstraints.rules
message AttributeValue {
  // Id of the attribute.
  string attribute_id = 1 [(buf.validate.field).required = true];
  // Values of the attribute; the populated case must match the attribute's type.
  oneof values {
    option (buf.validate.oneof).required = true;
    // Values of a TEXT attribute.
    collections.v1.StringCollection text_values = 2;
    // Values of a NUMBER attribute.
    collections.v1.Int64Collection number_values = 3;
    // Values of a DECIMAL attribute.
    collections.v1.DoubleCollection decimal_values = 4;
    // Values of a BOOLEAN attribute.
    collections.v1.BoolCollection boolean_values = 5;
    // Ids of existing IdentifiedComplexValues.
    collections.v1.StringCollection reference_values = 6;
    // Values of an IMAGE attribute.
    media.v1.ImageCollection image_values = 7;
    // Values of a COMPLEX attribute.
    ComplexCollection complex_values = 8;
  }
}

// ComplexValue is one instance of a complex attribute, with one AttributeValue per sub-attribute
message ComplexValue {
  // Values of the sub-attributes.
  repeated AttributeValue fields = 1;
}

// A list of complex values.
message ComplexCollection {
  // Values of the complex collection.
  repeated ComplexValue values = 1;
}

// IdentifiedComplexValue is a complex value with an id which can be used for referencing the value across different items
message IdentifiedComplexValue {
  // Id of the complex value.
  string id = 1;
  // Value of the complex value.
  ComplexValue value = 2;
}

// A product, described by attribute definitions.
message Product {
  // Id of the item template.
  string id = 1;
  // Name of the product.
  string name = 2;
  // Description of the product.
  string description = 3;
  // Attributes of the product.
  repeated Attribute attributes = 4;
}
