syntax = "proto3";

package content_management.v1;

import "buf/validate/validate.proto";
import "commons/v1/time.proto";
import "content_management/v1/content_management.proto";
import "google/protobuf/field_mask.proto";

// Request message for ContentManagementService.CreateContent.
message CreateContentRequest {
  // The content to create.
  content_management.v1.Content content = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "content.creator"
      message: "creator is required"
      expression: "this.creator != ''"
    },
    (buf.validate.field).cel = {
      id: "content.title_or_text"
      message: "title or text is required"
      expression: "this.title != '' || this.text != ''"
    }
  ];
}

// Response message for ContentManagementService.CreateContent.
message CreateContentResponse {
  // The created content.
  content_management.v1.Content content = 1;
}

// Request message for ContentManagementService.GetContent.
message GetContentRequest {
  // Id of the content to get.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for ContentManagementService.GetContent.
message GetContentResponse {
  // The requested content.
  content_management.v1.Content content = 1;
}

// Request message for ContentManagementService.UpdateContent.
message UpdateContentRequest {
  // The content to update. Its id identifies the content.
  content_management.v1.Content content = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in content are updated (AIP-134)
  google.protobuf.FieldMask update_mask = 2;
}

// Response message for ContentManagementService.UpdateContent.
message UpdateContentResponse {
  // The updated content.
  content_management.v1.Content content = 1;
}

// Request message for ContentManagementService.DeleteContent.
message DeleteContentRequest {
  // Id of the content to delete.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for ContentManagementService.DeleteContent.
message DeleteContentResponse {
  // The deleted content.
  content_management.v1.Content content = 1;
}

// Request message for ContentManagementService.ListContent.
message ListContentRequest {
  // Id of the user who created the content.
  string creator = 1;
  // Optional time window on creation or last update.
  oneof time_range {
    // Only content created in this range.
    commons.v1.TimeRange create_time_range = 2;
    // Only content last updated in this range.
    commons.v1.TimeRange update_time_range = 3;
  }
  // Maximum number of results to return. The server applies a default and a maximum.
  int64 page_size = 4 [(buf.validate.field).int64.gte = 0];
  // Page token from a previous response's next_page_token. Empty for the first page.
  string page_token = 5;
}

// Response message for ContentManagementService.ListContent.
message ListContentResponse {
  // The content items on this page.
  repeated content_management.v1.Content contents = 1;
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 2;
}

// Manages user-created content such as posts.
service ContentManagementService {
  // Creates content.
  rpc CreateContent(CreateContentRequest) returns (CreateContentResponse) {}
  // Gets content by id.
  rpc GetContent(GetContentRequest) returns (GetContentResponse) {}
  // Updates content.
  rpc UpdateContent(UpdateContentRequest) returns (UpdateContentResponse) {}
  // Deletes content and returns it.
  rpc DeleteContent(DeleteContentRequest) returns (DeleteContentResponse) {}
  // Lists content, a page at a time.
  rpc ListContent(ListContentRequest) returns (ListContentResponse) {}
}
