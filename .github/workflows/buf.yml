name: Buf

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUF_VERSION: 1.73.0

jobs:
  # Compiles all protos, runs buf lint (STANDARD + COMMENTS, incl. protovalidate rules), checks formatting and buf.lock
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          lint: true
          format: true
          breaking: false # pre-release; enable once the APIs are published
          push: false
          archive: false
          pr_comment: false
      - name: buf.lock is up to date
        run: make lock-check

  # Google API linter (AIPs), configured in .api-linter.yaml
  api-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: build/go/go.mod
          cache-dependency-path: build/go/go.sum
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - run: make api-lint

  # buf generate with the pinned remote plugins, then compile the generated Go and Java
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: build/go/go.mod
          cache-dependency-path: build/go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: build/java/pom.xml
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: Compile generated Go
        run: make compile-go
      - name: Compile generated Java
        run: make compile-java
