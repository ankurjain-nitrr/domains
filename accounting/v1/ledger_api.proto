syntax = "proto3";

package accounting.v1;

import "accounting/v1/ledger.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// Request message for LedgerService.CreateGroup.
message CreateGroupRequest {
  // The custom group to create, under parent_id.
  Group group = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "group.book_id"
      message: "book_id is required"
      expression: "this.book_id != ''"
    },
    (buf.validate.field).cel = {
      id: "group.name"
      message: "name is required"
      expression: "this.name != ''"
    },
    (buf.validate.field).cel = {
      id: "group.parent_id"
      message: "parent_id is required"
      expression: "this.parent_id != ''"
    }
  ];
}

// Response message for LedgerService.CreateGroup.
message CreateGroupResponse {
  // The created group.
  Group group = 1;
}

// Request message for LedgerService.GetGroup.
message GetGroupRequest {
  // Id of the group to get.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for LedgerService.GetGroup.
message GetGroupResponse {
  // The requested group.
  Group group = 1;
}

// Request message for LedgerService.UpdateGroup.
message UpdateGroupRequest {
  // The custom group to update. Its id identifies the group.
  Group group = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in group are updated (AIP-134)
  //
  // Only name and parent_id are updated.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).cel = {
    id: "update_group.update_mask"
    message: "only name and parent_id can be updated"
    expression: "this.paths.all(p, p in ['name', 'parent_id'])"
  }];
}

// Response message for LedgerService.UpdateGroup.
message UpdateGroupResponse {
  // The updated group.
  Group group = 1;
}

// Request message for LedgerService.DeleteGroup.
message DeleteGroupRequest {
  // Id of the custom group to delete. Fails with FAILED_PRECONDITION if it has ledgers or sub-groups.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for LedgerService.DeleteGroup.
message DeleteGroupResponse {
  // The deleted group.
  Group group = 1;
}

// Request message for LedgerService.ListGroups.
message ListGroupsRequest {
  // Id of the book whose groups to list.
  string book_id = 1 [(buf.validate.field).required = true];
  // Maximum number of results to return. The server applies a default and a maximum.
  int64 page_size = 2 [(buf.validate.field).int64.gte = 0];
  // Page token from a previous response's next_page_token. Empty for the first page.
  string page_token = 3;
}

// Response message for LedgerService.ListGroups.
message ListGroupsResponse {
  // The groups on this page, parents before children.
  repeated Group groups = 1;
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 2;
}

// Request message for LedgerService.CreateLedger.
message CreateLedgerRequest {
  // The ledger to create.
  Ledger ledger = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "ledger.book_id"
      message: "book_id is required"
      expression: "this.book_id != ''"
    },
    (buf.validate.field).cel = {
      id: "ledger.name"
      message: "name is required"
      expression: "this.name != ''"
    },
    (buf.validate.field).cel = {
      id: "ledger.group_id"
      message: "group_id is required"
      expression: "this.group_id != ''"
    }
  ];
}

// Response message for LedgerService.CreateLedger.
message CreateLedgerResponse {
  // The created ledger.
  Ledger ledger = 1;
}

// Request message for LedgerService.GetLedger.
message GetLedgerRequest {
  // Id of the ledger to get.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for LedgerService.GetLedger.
message GetLedgerResponse {
  // The requested ledger.
  Ledger ledger = 1;
}

// Request message for LedgerService.UpdateLedger.
message UpdateLedgerRequest {
  // The ledger to update. Its id identifies the ledger.
  Ledger ledger = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in ledger are updated (AIP-134)
  //
  // book_id, closing_balance and the timestamps are never updated here, including with a mask of * or no mask.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).cel = {
    id: "update_ledger.update_mask"
    message: "book_id, closing_balance, create_time and update_time can't be updated"
    expression: "!this.paths.exists(p, p in ['book_id', 'closing_balance', 'create_time', 'update_time'])"
  }];
}

// Response message for LedgerService.UpdateLedger.
message UpdateLedgerResponse {
  // The updated ledger.
  Ledger ledger = 1;
}

// Request message for LedgerService.DeleteLedger.
message DeleteLedgerRequest {
  // Id of the ledger to delete. Fails with FAILED_PRECONDITION if a voucher uses it.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for LedgerService.DeleteLedger.
message DeleteLedgerResponse {
  // The deleted ledger.
  Ledger ledger = 1;
}

// Request message for LedgerService.ListLedgers.
message ListLedgersRequest {
  // Id of the book whose ledgers to list.
  string book_id = 1 [(buf.validate.field).required = true];
  // Only ledgers directly under this group.
  string group_id = 2;
  // Maximum number of results to return. The server applies a default and a maximum.
  int64 page_size = 3 [(buf.validate.field).int64.gte = 0];
  // Page token from a previous response's next_page_token. Empty for the first page.
  string page_token = 4;
}

// Response message for LedgerService.ListLedgers.
message ListLedgersResponse {
  // The ledgers on this page.
  repeated Ledger ledgers = 1;
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 2;
}

// Manages a book's chart of accounts: groups and the ledgers under them.
service LedgerService {
  // Creates a custom group.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {}
  // Gets a group by id.
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse) {}
  // Updates a custom group. Fails with FAILED_PRECONDITION for a predefined group.
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {}
  // Deletes a custom group and returns it. Fails with FAILED_PRECONDITION for a predefined group.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {}
  // Lists groups, a page at a time.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {}
  // Creates a ledger.
  rpc CreateLedger(CreateLedgerRequest) returns (CreateLedgerResponse) {}
  // Gets a ledger by id.
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse) {}
  // Updates a ledger.
  rpc UpdateLedger(UpdateLedgerRequest) returns (UpdateLedgerResponse) {}
  // Deletes a ledger and returns it.
  rpc DeleteLedger(DeleteLedgerRequest) returns (DeleteLedgerResponse) {}
  // Lists ledgers, a page at a time.
  rpc ListLedgers(ListLedgersRequest) returns (ListLedgersResponse) {}
}
