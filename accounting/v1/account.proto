syntax = "proto3";

package accounting.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "validation/v1/rules.proto";

// A set of books (Tally's company), owned by a user or a business entity. Creating one seeds Tally's 28
// predefined groups.
message Account {
  // Unique identifier of the account.
  string id = 1;
  // Owner of the account: a user or a business entity, e.g. shop:BusinessEntity:b_1.
  string owner_arn = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.entity_arn) = true,
    (buf.validate.field).string.(validation.v1.owner_arn) = true
  ];
  // Name of the books, e.g. the business name.
  string name = 9;
  // ISO 4217 currency of every amount in the books, e.g. INR. Set at creation.
  string currency_code = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Z]{3}$"
  ];
  // Month the financial year starts, 1 to 12. 0 means 4 (April), as in India.
  int32 financial_year_start_month = 11 [(buf.validate.field).int32 = {
    gte: 0
    lte: 12
  }];
  // First day of the books. Vouchers can't be dated earlier.
  google.type.Date books_begin_date = 12;
  // Vouchers dated on or before this day can't be created, updated or cancelled. Unset locks nothing.
  google.type.Date books_locked_until = 13;
  // Time the account was created. Output only.
  google.protobuf.Timestamp create_time = 6;
  // Time the account was last updated. Output only.
  google.protobuf.Timestamp update_time = 7;

  // replaced by owner_arn
  reserved 2, 3;
  reserved "user_id", "business_entity_id";
}
