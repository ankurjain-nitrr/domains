syntax = "proto3";

package accounting.v1;

import "accounting/v1/book.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "validation/v1/rules.proto";

// Request message for BookService.CreateBook.
message CreateBookRequest {
  // The book to create.
  Book book = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "book.owner_arn"
      message: "owner_arn is required"
      expression: "this.owner_arn != ''"
    },
    (buf.validate.field).cel = {
      id: "book.name"
      message: "name is required"
      expression: "this.name != ''"
    },
    (buf.validate.field).cel = {
      id: "book.currency_code"
      message: "currency_code is required"
      expression: "this.currency_code != ''"
    }
  ];
}

// Response message for BookService.CreateBook.
message CreateBookResponse {
  // The created book.
  Book book = 1;
}

// Request message for BookService.GetBook.
message GetBookRequest {
  // Id of the book to get.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for BookService.GetBook.
message GetBookResponse {
  // The requested book.
  Book book = 1;
}

// Request message for BookService.UpdateBook.
message UpdateBookRequest {
  // The book to update. Its id identifies the book.
  Book book = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in book are updated (AIP-134)
  //
  // owner_arn, currency_code and the timestamps are never updated here, including with a mask of * or no mask.
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).cel = {
    id: "update_book.update_mask"
    message: "owner_arn, currency_code, create_time and update_time can't be updated"
    expression: "!this.paths.exists(p, p in ['owner_arn', 'currency_code', 'create_time', 'update_time'])"
  }];
}

// Response message for BookService.UpdateBook.
message UpdateBookResponse {
  // The updated book.
  Book book = 1;
}

// Request message for BookService.DeleteBook.
message DeleteBookRequest {
  // Id of the book to delete, with its groups, ledgers and vouchers.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for BookService.DeleteBook.
message DeleteBookResponse {
  // The deleted book.
  Book book = 1;
}

// Request message for BookService.ListBooks.
message ListBooksRequest {
  // Owner of the books to list, a user or business entity arn.
  string owner_arn = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(validation.v1.entity_arn) = true,
    (buf.validate.field).string.(validation.v1.owner_arn) = true
  ];
  // Maximum number of results to return. The server applies a default and a maximum.
  int64 page_size = 2 [(buf.validate.field).int64.gte = 0];
  // Page token from a previous response's next_page_token. Empty for the first page.
  string page_token = 3;
}

// Response message for BookService.ListBooks.
message ListBooksResponse {
  // The books on this page.
  repeated Book books = 1;
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 2;
}

// Manages books of accounts, each holding groups, ledgers and vouchers.
service BookService {
  // Creates a book and seeds its predefined groups.
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse) {}
  // Gets a book by id.
  rpc GetBook(GetBookRequest) returns (GetBookResponse) {}
  // Updates a book.
  rpc UpdateBook(UpdateBookRequest) returns (UpdateBookResponse) {}
  // Deletes a book and returns it.
  rpc DeleteBook(DeleteBookRequest) returns (DeleteBookResponse) {}
  // Lists an owner's books, a page at a time.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {}
}
