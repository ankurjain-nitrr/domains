syntax = "proto3";

package accounting.ledger.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";
import "validation/v1/rules.proto";

// An amount on the debit or credit side, e.g. a ledger balance.
message Balance {
  // The amount, not negative, in the books' currency.
  google.type.Money amount = 1;
  // Debit or credit.
  EntryType side = 2 [(buf.validate.field).enum.defined_only = true];
}

// A group in the chart of accounts (Tally's group), e.g. Sundry Debtors under Current Assets. Every account starts
// with Tally's 28 predefined groups; custom groups go under them.
message Group {
  // Id of the group.
  string id = 1;
  // Id of the account (books) the group is in.
  string account_id = 2;
  // Name of the group, unique in the account.
  string name = 3;
  // Id of the parent group. Empty for a primary group.
  string parent_id = 4;
  // Nature of the group: ASSET, LIABILITY, INCOME or EXPENSE. Sub-groups take their parent's.
  GeneralLedgerType nature = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).enum = {
      in: [
        1,
        2,
        4,
        5
      ]
    }
  ];
  // Whether its ledgers count toward gross profit (Tally's direct incomes and expenses, sales and purchases).
  bool affects_gross_profit = 6;
  // Whether it is one of Tally's predefined groups, which can't be renamed, moved or deleted. Output only.
  bool predefined = 7;
  // Time the group was created. Output only.
  google.protobuf.Timestamp create_time = 8;
  // Time the group was last updated. Output only.
  google.protobuf.Timestamp update_time = 9;
}

// A ledger (Tally's ledger) in an account's books, e.g. a bank, a customer or Sales.
message GeneralLedger {
  // Id of the general ledger.
  string id = 1;
  // Tenant id.
  string tenant_id = 2;
  // Id of the account (books) the ledger is in.
  string account_id = 3;
  // Name of the ledger, unique in the account.
  string name = 7;
  // Id of the group it is under.
  string group_id = 8;
  // Balance at the start of the books.
  Balance opening_balance = 9;
  // Balance after every active voucher. Output only.
  Balance closing_balance = 10;
  // Customer or supplier the ledger is for, e.g. shop:BusinessEntity:b_1. Usually under Sundry Debtors or Creditors.
  string party_arn = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.entity_arn) = true
  ];
  // Whether entries are tracked against bills (bill-wise details), for outstanding receivables and payables.
  bool bill_wise = 12;
  // Time the ledger was created. Output only.
  google.protobuf.Timestamp create_time = 5;
  // Time the ledger was last updated. Output only.
  google.protobuf.Timestamp update_time = 6;

  // replaced by closing_balance
  reserved 4;
  reserved "balance";
}

// How a voucher entry settles bills of a bill-wise ledger.
message BillAllocation {
  // Kind of bill reference.
  enum Type {
    // Unspecified. Not a valid value.
    TYPE_UNSPECIFIED = 0;
    // Creates a bill, e.g. on a sales or purchase voucher.
    TYPE_NEW_REFERENCE = 1;
    // Settles an existing bill, e.g. on a receipt or payment.
    TYPE_AGAINST_REFERENCE = 2;
    // Paid or received before the bill exists; settled when it is raised.
    TYPE_ADVANCE = 3;
    // Not tied to any bill.
    TYPE_ON_ACCOUNT = 4;
  }

  // Kind of reference.
  Type type = 1 [(buf.validate.field).enum.defined_only = true];
  // Bill name, e.g. the invoice number. Empty for ON_ACCOUNT.
  string name = 2;
  // Due date of a new bill.
  google.type.Date due_date = 3;
  // Amount allocated to the bill.
  google.type.Money amount = 4;
}

// One debit or credit line of a voucher.
message GeneralLedgerEntry {
  // Id of the general ledger entry. Output only.
  string id = 1;
  // Id of the general ledger.
  string ledger_id = 2;
  // Debit or credit.
  EntryType entry_type = 5 [(buf.validate.field).enum.defined_only = true];
  // Amount of the transaction.
  google.type.Money amount = 6 [(buf.validate.field).cel = {
    id: "general_ledger_entry.amount_positive"
    message: "amount must be positive"
    expression: "this.units > 0 || (this.units == 0 && this.nanos > 0)"
  }];
  // Bills it creates or settles, for a bill-wise ledger. Allocations add up to amount.
  repeated BillAllocation bill_allocations = 10;

  // moved to Voucher
  reserved 3, 4, 7, 8, 9;
  reserved "account_id", "general_ledger_type", "entry_time", "description", "reference_id";
}

// An accounting voucher (Tally's voucher): one balanced transaction of two or more entries.
message Voucher {
  // Lifecycle of a voucher.
  enum State {
    // Unspecified. Not a valid value.
    STATE_UNSPECIFIED = 0;
    // Counts toward balances and reports.
    STATE_ACTIVE = 1;
    // Cancelled: keeps its number, no longer counts.
    STATE_CANCELLED = 2;
  }

  // Id of the voucher.
  string id = 1;
  // Id of the account (books) it is in.
  string account_id = 2;
  // Kind of voucher.
  VoucherType type = 3 [(buf.validate.field).enum.defined_only = true];
  // Number, sequential per type and financial year. Output only.
  string number = 4;
  // Accounting date.
  google.type.Date date = 5;
  // Narration.
  string narration = 6;
  // External reference, e.g. the supplier's invoice number.
  string reference = 7;
  // Entity that produced it, e.g. shop:Order:o_1.
  string source_arn = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.entity_arn) = true
  ];
  // Debit and credit entries. Debits add up to credits.
  repeated GeneralLedgerEntry entries = 9;
  // Lifecycle state. Set by CreateVoucher and CancelVoucher.
  State state = 10 [(buf.validate.field).enum.defined_only = true];
  // Time the voucher was created. Output only.
  google.protobuf.Timestamp create_time = 11;
  // Time the voucher was last updated. Output only.
  google.protobuf.Timestamp update_time = 12;
}

// Nature of a group. Groups use ASSET, LIABILITY (including capital), INCOME and EXPENSE, as in Tally.
enum GeneralLedgerType {
  // Unspecified. Not a valid value.
  GENERAL_LEDGER_TYPE_UNSPECIFIED = 0;
  // Cash, Debtor, Inventory, etc.
  GENERAL_LEDGER_TYPE_ASSET = 1;
  // Creditor, Loan, etc.
  GENERAL_LEDGER_TYPE_LIABILITY = 2;
  // Owner's Equity, Shareholders' Equity, etc.
  GENERAL_LEDGER_TYPE_EQUITY = 3;
  // Sales Revenue, Interest Income, etc.
  GENERAL_LEDGER_TYPE_INCOME = 4;
  // Rent Expense, Salaries Expense, etc.
  GENERAL_LEDGER_TYPE_EXPENSE = 5;
  // Sales Revenue, Interest Revenue, etc.
  GENERAL_LEDGER_TYPE_REVENUE = 6;
  // For non-operating gains.
  GENERAL_LEDGER_TYPE_GAIN = 7;
  // For non-operating losses.
  GENERAL_LEDGER_TYPE_LOSS = 8;
  // For other types of general ledger.
  GENERAL_LEDGER_TYPE_OTHER = 9;
}

// Side of a double-entry posting.
enum EntryType {
  // Unspecified. Not a valid value.
  ENTRY_TYPE_UNSPECIFIED = 0;
  // Debit entry.
  ENTRY_TYPE_DEBIT = 1;
  // Credit entry.
  ENTRY_TYPE_CREDIT = 2;
}

// Kind of accounting voucher, as in Tally.
enum VoucherType {
  // Unspecified. Not a valid value.
  VOUCHER_TYPE_UNSPECIFIED = 0;
  // Cash deposited in or withdrawn from a bank, or a transfer between cash and bank ledgers only.
  VOUCHER_TYPE_CONTRA = 1;
  // Money paid out: credits a cash or bank ledger.
  VOUCHER_TYPE_PAYMENT = 2;
  // Money received: debits a cash or bank ledger.
  VOUCHER_TYPE_RECEIPT = 3;
  // Adjustments with no cash or bank, e.g. depreciation, provisions.
  VOUCHER_TYPE_JOURNAL = 4;
  // Sale of goods or services.
  VOUCHER_TYPE_SALES = 5;
  // Purchase of goods or services.
  VOUCHER_TYPE_PURCHASE = 6;
  // Purchase return or a supplier's charge, debiting the supplier.
  VOUCHER_TYPE_DEBIT_NOTE = 7;
  // Sales return or an allowance to a customer, crediting the customer.
  VOUCHER_TYPE_CREDIT_NOTE = 8;
}
