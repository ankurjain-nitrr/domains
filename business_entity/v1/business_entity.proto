syntax = "proto3";

package business_entity.v1;

import "buf/validate/validate.proto";
import "commons/v1/address.proto";
import "commons/v1/phone.proto";
import "validation/v1/rules.proto";

// Business entity as per indian laws and regulations
message BusinessEntity {
  option (buf.validate.message).cel = {
    id: "business_entity.gstin_matches_pan"
    message: "gstin must contain the entity's PAN"
    expression: "this.gstin == '' || this.pan_number == '' || this.gstin.matches('^[0-9]{2}' + this.pan_number)"
  };
  // Unique identifier of the business entity.
  string id = 1;
  // Name of the business entity.
  string name = 2;
  // Type of business entity (enumeration provided below)
  BusinessType entity_type = 3 [(buf.validate.field).enum.defined_only = true];
  // PAN (Permanent Account Number) for the business entity.
  string pan_number = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.pan) = true
  ];
  // GSTIN (Goods and Services Tax Identification Number), if applicable.
  string gstin = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.gstin) = true
  ];
  // CIN (Corporate Identification Number), applicable for companies.
  string cin = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.cin) = true
  ];
  // Registered office address.
  commons.v1.Address registered_address = 7;
  // Directors of the entity.
  repeated Director directors = 8;
  // Contact email of the entity.
  string email = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.email = true
  ];
  // Contact phone numbers of the entity.
  repeated commons.v1.Phone phone = 10;
  // Website of the entity, an http or https URL.
  string website = 11 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.http_url) = true
  ];
  // Whether the business entity is active.
  bool is_active = 12;
}

// Enumeration representing different types of business entities in India
enum BusinessType {
  // Unspecified business type.
  BUSINESS_TYPE_UNSPECIFIED = 0;
  // Sole proprietorship.
  BUSINESS_TYPE_SOLE_PROPRIETORSHIP = 1;
  // Partnership firm.
  BUSINESS_TYPE_PARTNERSHIP = 2;
  // Limited Liability Partnership.
  BUSINESS_TYPE_LLP = 3;
  // Private Limited Company.
  BUSINESS_TYPE_PRIVATE_LIMITED_COMPANY = 4;
  // Public Limited Company.
  BUSINESS_TYPE_PUBLIC_LIMITED_COMPANY = 5;
  // One Person Company.
  BUSINESS_TYPE_ONE_PERSON_COMPANY = 6;
  // Trust.
  BUSINESS_TYPE_TRUST = 7;
  // Society or Co-operative Society.
  BUSINESS_TYPE_SOCIETY = 8;
  // Section 8 Company (Non-profit)
  BUSINESS_TYPE_SECTION_8_COMPANY = 9;
  // Government-owned Company.
  BUSINESS_TYPE_GOVERNMENT_COMPANY = 10;
}

// A director of a business entity.
message Director {
  // User id of the director, should have a valid KYC.
  string user_id = 1 [(buf.validate.field).required = true];
  // Director Identification Number // optional.
  string din = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.(validation.v1.din) = true
  ];
}
