syntax = "proto3";

package business_entity.v1;

import "buf/validate/validate.proto";
import "business_entity/v1/business_entity.proto";
import "google/protobuf/field_mask.proto";

// Request message for BusinessEntityService.CreateBusinessEntity.
message CreateBusinessEntityRequest {
  // The business entity to create.
  business_entity.v1.BusinessEntity business_entity = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "business_entity.name"
      message: "name is required"
      expression: "this.name != ''"
    },
    (buf.validate.field).cel = {
      id: "business_entity.entity_type"
      message: "entity_type is required"
      expression: "this.entity_type != 0"
    },
    (buf.validate.field).cel = {
      id: "business_entity.pan_number"
      message: "pan_number is required"
      expression: "this.pan_number != ''"
    },
    (buf.validate.field).cel = {
      id: "business_entity.cin_for_companies"
      message: "cin is required for companies"
      expression: "!(this.entity_type in [4, 5, 6, 9, 10]) || this.cin != ''"
    }
  ];
}

// Response message for BusinessEntityService.CreateBusinessEntity.
message CreateBusinessEntityResponse {
  // The created business entity.
  business_entity.v1.BusinessEntity business_entity = 2;

  // replaced by business_entity
  reserved 1;
  reserved "id";
}

// Request message for BusinessEntityService.GetBusinessEntity.
message GetBusinessEntityRequest {
  // Id of the business entity to get.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for BusinessEntityService.GetBusinessEntity.
message GetBusinessEntityResponse {
  // The requested business entity.
  business_entity.v1.BusinessEntity business_entity = 1;
}

// Request message for BusinessEntityService.UpdateBusinessEntity.
message UpdateBusinessEntityRequest {
  // The business entity to update. Its id identifies the business entity.
  business_entity.v1.BusinessEntity business_entity = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in business_entity are updated (AIP-134)
  google.protobuf.FieldMask update_mask = 2;
}

// Response message for BusinessEntityService.UpdateBusinessEntity.
message UpdateBusinessEntityResponse {
  // The updated business entity.
  business_entity.v1.BusinessEntity business_entity = 1;
}

// Request message for BusinessEntityService.DeleteBusinessEntity.
message DeleteBusinessEntityRequest {
  // Id of the business entity to delete.
  string id = 1 [(buf.validate.field).required = true];
}

// Response message for BusinessEntityService.DeleteBusinessEntity.
message DeleteBusinessEntityResponse {
  // The deleted business entity.
  business_entity.v1.BusinessEntity business_entity = 1;
}

// Request message for BusinessEntityService.ListBusinessEntities.
message ListBusinessEntitiesRequest {
  // Entities this user is a director of, references iam.
  string director_user_id = 1 [(buf.validate.field).required = true];
  // Only entities of this type.
  business_entity.v1.BusinessType entity_type = 2 [(buf.validate.field).enum.defined_only = true];
  // Maximum number of results to return. The server applies a default and a maximum.
  int64 page_size = 3 [(buf.validate.field).int64.gte = 0];
  // Page token from a previous response's next_page_token. Empty for the first page.
  string page_token = 4;
}

// Response message for BusinessEntityService.ListBusinessEntities.
message ListBusinessEntitiesResponse {
  // The business entities on this page.
  repeated business_entity.v1.BusinessEntity business_entities = 1;
  // Token for the next page. Empty when there are no more results.
  string next_page_token = 2;
}

// Manages business entities registered under Indian law.
service BusinessEntityService {
  // Creates a business entity.
  rpc CreateBusinessEntity(CreateBusinessEntityRequest) returns (CreateBusinessEntityResponse) {}
  // Gets a business entity by id.
  rpc GetBusinessEntity(GetBusinessEntityRequest) returns (GetBusinessEntityResponse) {}
  // Updates a business entity.
  rpc UpdateBusinessEntity(UpdateBusinessEntityRequest) returns (UpdateBusinessEntityResponse) {}
  // Deletes a business entity and returns it.
  rpc DeleteBusinessEntity(DeleteBusinessEntityRequest) returns (DeleteBusinessEntityResponse) {}
  // Lists business entities, a page at a time.
  rpc ListBusinessEntities(ListBusinessEntitiesRequest) returns (ListBusinessEntitiesResponse) {}
}
