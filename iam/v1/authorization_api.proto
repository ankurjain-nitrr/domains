syntax = "proto3";

package iam.v1;

import "buf/validate/validate.proto";
import "iam/v1/actions.proto";

// checks if the user has the permission to perform the action on the resource or has a specific permission
message AuthorizeRequest {
  // Actions to check on one resource.
  message ResourceAction {
    // Resource arn.
    string resource = 1 [(buf.validate.field).required = true];
    // Actions to check. All must be allowed.
    repeated Action actions = 2 [(buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: {
        enum: {
          defined_only: true
          not_in: [0]
        }
      }
    }];
  }
  // User token.
  string token = 1 [(buf.validate.field).required = true];
  // What to check: actions on a resource, or a specific permission.
  oneof permission {
    option (buf.validate.oneof).required = true;
    // Check actions on a resource.
    ResourceAction resource_action = 2;
    // Id of the permission.
    string permission_id = 3 [(buf.validate.field).string.min_len = 1];
  }
}

// Response message for AuthorizationService.Authorize.
message AuthorizeResponse {
  // Whether the user is authorized.
  bool authorized = 1;
}

// Checks whether a token's user may perform actions on a resource.
service AuthorizationService {
  // Checks whether the token's user may perform actions on a resource, or holds a permission.
  // (-- api-linter: core::0136::verb-noun=disabled
  //     aip.dev/not-precedent: Authorize is the established name for this check. --)
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse) {}
}
