syntax = "proto3";

package iam.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "iam/v1/actions.proto";

// permissions that allows roles to perform actions on a specific resource
message Permission {
  string id = 1;
  string name = 2;
  string description = 3;
  // tenent:user_id:entity_type:entity_id
  // ex: social_network:user_id_123:Content:content_id_123 # specific content
  // ex: social_network:user_id_123:Comment:* # all comments created by user_id_123
  // ex: social_network:*:Comment:* # all comments on the platform
  string resource = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = '^[^:]+:[^:]+:[^:]+:[^:]+$'
  ];
  // one of all actions (boolean) or specific actions (list of strings)
  oneof actions {
    bool all_actions = 5;
    Actions actions_list = 6;
  }
  string tenant = 7;
  bool is_active = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;

  message Actions {
    repeated iam.v1.Action actions = 1 [(buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: {
        enum: {
          defined_only: true
          not_in: [0]
        }
      }
    }];
  }
}

// roles that can be assigned to users
message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
  repeated string permissions = 6 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {min_len: 1}
    }
  }]; // references permission id from permission service
  string tenant = 7;
  bool is_active = 8;
}

message CreatePermissionRequest {
  Permission permission = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "permission.name"
      message: "name is required"
      expression: "this.name != ''"
    },
    (buf.validate.field).cel = {
      id: "permission.resource"
      message: "resource is required"
      expression: "this.resource != ''"
    },
    (buf.validate.field).cel = {
      id: "permission.tenant"
      message: "tenant is required"
      expression: "this.tenant != ''"
    },
    (buf.validate.field).cel = {
      id: "permission.actions"
      message: "actions is required"
      expression: "has(this.all_actions) || has(this.actions_list)"
    }
  ];
}

message CreatePermissionResponse {
  Permission permission = 1;
}

message GetPermissionRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message GetPermissionResponse {
  Permission permission = 1;
}

message UpdatePermissionRequest {
  Permission permission = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in permission are updated (AIP-134)
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePermissionResponse {
  Permission permission = 1;
}

message DeletePermissionRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message DeletePermissionResponse {
  Permission permission = 1;
}

message CreateRoleRequest {
  Role role = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "role.name"
      message: "name is required"
      expression: "this.name != ''"
    },
    (buf.validate.field).cel = {
      id: "role.tenant"
      message: "tenant is required"
      expression: "this.tenant != ''"
    }
  ];
}

message CreateRoleResponse {
  Role role = 1;
}

message GetRoleRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message GetRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  Role role = 1 [(buf.validate.field).required = true];
  // fields to update; if omitted, all fields set in role are updated (AIP-134)
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message DeleteRoleResponse {
  Role role = 1;
}

service RolePermissionService {
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse) {}
  rpc GetPermission(GetPermissionRequest) returns (GetPermissionResponse) {}
  rpc UpdatePermission(UpdatePermissionRequest) returns (UpdatePermissionResponse) {}
  rpc DeletePermission(DeletePermissionRequest) returns (DeletePermissionResponse) {} // marks the permission as inactive
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {}
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {}
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {}
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {} // marks the role as inactive
}
